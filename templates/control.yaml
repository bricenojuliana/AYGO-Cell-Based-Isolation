AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  CellSaaS - control plane (SPEC 5.4): once a minute the detector reads per-tenant metrics, scores
  them (z-score, ADR-006), isolates a noisy tenant in the quarantine cell (ADR-007) and writes every
  decision to an append-only audit log. Mode in SSM /cellsaas/control/mode: off | observe | act.

Parameters:
  ZThreshold:
    Type: Number
    Default: 3
  KWindows:
    Type: Number
    Default: 2
    MinValue: 1
  WarmupWindows:
    Type: Number
    Default: 5
    MinValue: 1
  SloP99Ms:
    Type: Number
    Default: 500
  MetricsLagSeconds:
    Type: Number
    Default: 60
    MinValue: 0
  LogRetentionDays:
    Type: Number
    Default: 7
    AllowedValues: [1, 3, 5, 7, 14, 30]
  ExecutionRoleArn:
    Type: String
    Default: ""
    AllowedPattern: "^(arn:aws[a-zA-Z-]*:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]+)?$"
    Description: Empty creates a least-privilege role; in Learner Lab pass the LabRole ARN (ADR-008).

Conditions:
  CreateRole: !Equals [!Ref ExecutionRoleArn, ""]

Resources:
  ControlTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: cellsaas-control
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: pk, AttributeType: S}
        - {AttributeName: sk, AttributeType: S}
      KeySchema:
        - {AttributeName: pk, KeyType: HASH}
        - {AttributeName: sk, KeyType: RANGE}
      SSESpecification:
        SSEEnabled: true

  DetectorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/cellsaas-detector
      RetentionInDays: !Ref LogRetentionDays

  DetectorRole:
    Type: AWS::IAM::Role
    Condition: CreateRole
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: control-plane
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [cloudwatch:GetMetricData, cloudwatch:ListMetrics]
                Resource: "*"
              - Effect: Allow
                Action: [dynamodb:Query, dynamodb:PutItem, dynamodb:BatchWriteItem]
                Resource: !GetAtt ControlTable.Arn
              - Effect: Allow
                Action: [dynamodb:Scan, dynamodb:UpdateItem]
                Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/cellsaas-routing
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cellsaas/control/mode
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt DetectorLogGroup.Arn

  DetectorFunction:
    Type: AWS::Serverless::Function
    DependsOn: DetectorLogGroup
    Properties:
      FunctionName: cellsaas-detector
      Description: CellSaaS control loop - detect, isolate, audit
      CodeUri: ../src
      Handler: cellsaas.control.handler.lambda_handler
      Runtime: python3.13
      Architectures: [arm64]
      MemorySize: 256
      Timeout: 50
      Role: !If [CreateRole, !GetAtt DetectorRole.Arn, !Ref ExecutionRoleArn]
      Environment:
        Variables:
          ROUTING_TABLE_NAME: cellsaas-routing
          CONTROL_TABLE_NAME: !Ref ControlTable
          QUARANTINE_CELL: q
          Z_THRESHOLD: !Ref ZThreshold
          K_WINDOWS: !Ref KWindows
          WARMUP_WINDOWS: !Ref WarmupWindows
          SLO_P99_MS: !Ref SloP99Ms
          METRICS_LAG_SECONDS: !Ref MetricsLagSeconds
      Events:
        EveryMinute:
          Type: Schedule  # EventBridge rule + resource policy: needs no IAM role (ADR-008)
          Properties:
            Schedule: rate(1 minute)

Outputs:
  ControlTableName:
    Value: !Ref ControlTable
